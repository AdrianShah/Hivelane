name: Release

# Ships the `synergo` CLI: PyPI (what `pipx install synergo` / `uv tool install
# synergo` pull), a GitHub release with checksums, and the Homebrew tap.
#
# Runs alongside deploy.yml, which also fires on v* tags and deploys the relay
# and dashboard. The two never wait on each other and use different concurrency
# groups, so a slow PyPI publish cannot hold up a relay deploy or vice versa.
on:
  push:
    tags: ["v*"]
  # A dry run: build, test and smoke-install without publishing anything. The
  # publish jobs below only run for tag refs.
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  # Never cancel a release half-way: PyPI uploads cannot be retracted.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: build sdist + wheel
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install --upgrade build twine
      - name: Read the version
        id: version
        # synergo/__init__.py is the single source (pyproject reads it via
        # hatch), and it imports nothing, so no dependencies are needed here.
        run: |
          version=$(python -c "import synergo; print(synergo.__version__)")
          prerelease=$(python -c "import sys; from packaging.version import Version; print(str(Version(sys.argv[1]).is_prerelease).lower())" "$version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "synergo $version (prerelease: $prerelease)"
      - name: Tag matches synergo.__version__
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "::error title=Version mismatch::Tag $TAG does not match synergo.__version__ ($VERSION). Bump synergo/__init__.py and retag."
            exit 1
          fi
      - name: Build
        # python -m build makes the sdist first and the wheel from it, so a file
        # missing from the sdist fails here rather than on a user's machine.
        run: python -m build
      - name: Check metadata
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          twine check --strict dist/*
          ls -l dist
          test -f "dist/synergo-$VERSION-py3-none-any.whl"
          test -f "dist/synergo-$VERSION.tar.gz"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  test:
    # Not `uses: ./.github/workflows/ci.yml`: deploy.yml already calls it for this
    # same tag, and two callers on one ref share ci.yml's concurrency group and
    # cancel each other. This is the cheap subset that guards the package itself.
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            server/requirements*.txt
            pyproject.toml
      - name: Install
        run: pip install -r server/requirements-dev.txt -e ".[dev]"
      - name: Test
        run: pytest -q
        timeout-minutes: 10

  smoke:
    # Install the built wheel the way a user would — into a fresh venv, from
    # outside the source tree — and run it. Catches a missing module, a broken
    # entry point or an unpinned dependency that the editable install hides.
    name: smoke install (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Install the wheel and run it
        shell: bash
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          python -m venv smoke-venv
          if [ -d smoke-venv/Scripts ]; then bin=smoke-venv/Scripts; else bin=smoke-venv/bin; fi
          "$bin/python" -m pip install --quiet "dist/synergo-$VERSION-py3-none-any.whl"
          out=$("$bin/synergo" --version)
          echo "$out"
          case "$out" in
            *"$VERSION"*) ;;
            *) echo "::error title=Wrong version::synergo --version printed '$out', expected $VERSION"; exit 1 ;;
          esac
          "$bin/synergo" --help >/dev/null

  pypi:
    name: publish to PyPI
    needs: [build, test, smoke]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Trusted publishing: PyPI trusts this repo + workflow + environment, so
    # there is no API token to store or leak. Configure the publisher on PyPI
    # (owner AdrianShah, repo Synergo, workflow release.yml, environment pypi).
    environment:
      name: pypi
      url: https://pypi.org/project/synergo/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: GitHub release
    needs: [build, pypi]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # A re-run: refresh the assets instead of failing on the existing release.
            gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
            exit 0
          fi
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Synergo $TAG" \
            --generate-notes \
            --verify-tag \
            "${flags[@]}"

  homebrew:
    # Bumps Formula/synergo.rb in AdrianShah/homebrew-synergo to the sdist PyPI
    # now serves. Stable releases only: a tap formula has no prerelease channel.
    name: bump Homebrew tap
    needs: [build, pypi]
    if: startsWith(github.ref, 'refs/tags/v') && needs.build.outputs.prerelease != 'true'
    # macOS for a real `brew`: it regenerates the Python resources and proves the
    # formula installs before anything is pushed to the tap.
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.build.outputs.version }}
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - name: Check for the tap token
        id: gate
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice title=Homebrew bump skipped::No HOMEBREW_TAP_TOKEN secret. Add a token with contents:write on AdrianShah/homebrew-synergo to enable it."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.gate.outputs.enabled == 'true'
        with:
          # Only for packaging/homebrew/synergo.rb, the template for a first bump.
          path: synergo
      - uses: actions/checkout@v7
        if: steps.gate.outputs.enabled == 'true'
        with:
          repository: AdrianShah/homebrew-synergo
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Wait for PyPI to serve the sdist
        id: pypi
        if: steps.gate.outputs.enabled == 'true'
        # The JSON API lags the upload by a CDN refresh; poll rather than race it.
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.error, urllib.request

          version = os.environ["VERSION"]
          url = f"https://pypi.org/pypi/synergo/{version}/json"
          for attempt in range(30):
              try:
                  with urllib.request.urlopen(url, timeout=10) as response:
                      release = json.load(response)
                  break
              except (urllib.error.URLError, TimeoutError):
                  time.sleep(10)
          else:
              raise SystemExit(f"::error title=PyPI not serving {version}::{url} did not answer after 5 minutes")

          sdist = next(f for f in release["urls"] if f["packagetype"] == "sdist")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"url={sdist['url']}\n")
              out.write(f"sha256={sdist['digests']['sha256']}\n")
          print(sdist["url"], sdist["digests"]["sha256"])
          PY
      - name: Point the formula at the release
        if: steps.gate.outputs.enabled == 'true'
        env:
          SDIST_URL: ${{ steps.pypi.outputs.url }}
          SDIST_SHA256: ${{ steps.pypi.outputs.sha256 }}
        run: |
          mkdir -p tap/Formula
          if [ ! -f tap/Formula/synergo.rb ]; then
            cp synergo/packaging/homebrew/synergo.rb tap/Formula/synergo.rb
          fi
          python3 - <<'PY'
          import os, pathlib, re

          path = pathlib.Path("tap/Formula/synergo.rb")
          text = path.read_text(encoding="utf-8")
          # Only the formula's own url/sha256 sit at two-space indent; the
          # resource blocks below are indented further and left to brew.
          text, urls = re.subn(r'^  url ".*"$', f'  url "{os.environ["SDIST_URL"]}"', text, count=1, flags=re.M)
          text, shas = re.subn(r'^  sha256 ".*"$', f'  sha256 "{os.environ["SDIST_SHA256"]}"', text, count=1, flags=re.M)
          if urls != 1 or shas != 1:
              raise SystemExit("::error::could not find the formula's top-level url/sha256 lines")
          path.write_text(text, encoding="utf-8")
          PY
      - name: Regenerate resources and test the formula
        if: steps.gate.outputs.enabled == 'true'
        # Linking the checkout in as the tap (as Homebrew/actions/setup-homebrew
        # does) lets brew edit the formula in place and resolve it by name.
        run: |
          taps="$(brew --repository)/Library/Taps/adrianshah"
          mkdir -p "$taps"
          ln -sfn "$GITHUB_WORKSPACE/tap" "$taps/homebrew-synergo"
          brew update-python-resources adrianshah/synergo/synergo
          brew install --build-from-source adrianshah/synergo/synergo
          brew test adrianshah/synergo/synergo
      - name: Push the bump
        if: steps.gate.outputs.enabled == 'true'
        working-directory: tap
        run: |
          git add Formula/synergo.rb
          if git diff --cached --quiet; then
            echo "::notice title=Homebrew formula unchanged::Formula/synergo.rb already points at $VERSION"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "synergo $VERSION"
          git push
