name: Image

# Builds the relay image (relay + bundled dashboard, from the root Dockerfile)
# for linux/amd64 and linux/arm64 and publishes it to GitHub Container Registry:
#
#   ghcr.io/adrianshah/hivelane-relay:edge        every push to main
#   ghcr.io/adrianshah/hivelane-relay:1.2.3, 1.2  v* tags
#   ghcr.io/adrianshah/hivelane-relay:latest      v* tags that are not prereleases
#
# Pull requests build and boot the amd64 image only (no QEMU, no arm64, no cache
# writes), and push nothing. arm64 is built on main and tags.
# Runs beside deploy.yml and release.yml, which also fire on main and v* tags,
# in a concurrency group of its own so none of them waits on or cancels another.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - deploy/docker-entrypoint.sh
      - server/**
      - frontend/**
      - .github/workflows/image.yml
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  # A newer PR push supersedes the build in flight; a publish always finishes,
  # so a tag's image is never half-pushed.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # GHCR names must be lower case, unlike the GitHub owner.
  IMAGE: ghcr.io/adrianshah/hivelane-relay

jobs:
  image:
    name: build, boot, publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: github.event_name != 'pull_request'
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # latest=auto: `latest` goes on stable v* tags only, never on a
          # prerelease such as v1.0.0-rc1 or on edge.
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=edge,branch=main
            type=ref,event=pr
          labels: |
            org.opencontainers.image.title=Hivelane relay
            org.opencontainers.image.description=Hivelane relay with the bundled dashboard
            org.opencontainers.image.licenses=Apache-2.0

      # The same checks as ci.yml's "relay image" job, plus the dashboard: the
      # amd64 image is built into the local daemon and booted before anything
      # is pushed. Its layers land in the cache the multi-arch build reuses.
      - name: Build (amd64, for the boot check)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: hivelane-relay:check
          build-args: HIVELANE_COMMIT=${{ github.sha }}
          cache-from: type=gha
          # Pull requests read the cache but never write it (10 GB limit).
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max' || '' }}

      - name: Boot and check the relay and dashboard
        run: |
          docker run -d --name relay -p 8000:8000 \
            -e HIVELANE_ENV=production \
            -e CORS_ORIGINS=https://example.test \
            hivelane-relay:check
          ready=""
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/readyz >/dev/null 2>&1; then
              ready=yes
              break
            fi
            sleep 2
          done
          status=0
          if [ -z "$ready" ]; then
            echo "::error title=Relay not ready::/readyz did not answer within 60s"
            status=1
          else
            curl -fsS http://127.0.0.1:8000/readyz && echo
            curl -fsS http://127.0.0.1:8000/health && echo
            # The dashboard at /, and the single-page-app fallback for a room link.
            curl -fsS http://127.0.0.1:8000/ | grep -qi '<div id="root"' \
              || { echo "::error title=No dashboard::GET / did not return the dashboard"; status=1; }
            curl -fsS http://127.0.0.1:8000/r/ABCDEFGH | grep -qi '<div id="root"' \
              || { echo "::error title=No SPA fallback::GET /r/ABCDEFGH did not return the dashboard"; status=1; }
          fi
          if [ "$status" -ne 0 ]; then docker logs relay >&2; fi
          docker rm -f relay >/dev/null
          exit "$status"

      - name: Root-owned volume (Fly/Render) keeps the room store
        # Fly volumes and Render disks mount root-owned over /data; the
        # entrypoint must hand the directory to uid 10001 so SQLite opens.
        run: |
          sudo mkdir -p "$RUNNER_TEMP/rootdata"
          sudo chown root:root "$RUNNER_TEMP/rootdata"
          sudo chmod 755 "$RUNNER_TEMP/rootdata"
          docker run -d --name relay-vol -p 8001:8000 \
            -e HIVELANE_ENV=production \
            -e CORS_ORIGINS=https://example.test \
            -v "$RUNNER_TEMP/rootdata:/data" \
            hivelane-relay:check
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8001/readyz >/dev/null 2>&1 && break
            sleep 2
          done
          status=0
          owner=$(docker exec relay-vol stat -c %u /data) || owner=""
          user=$(docker exec relay-vol sh -c 'cat /proc/1/status' | awk '/^Uid:/ {print $2}') || user=""
          echo "/data owner uid: $owner, relay uid: $user"
          [ "$owner" = 10001 ] || { echo "::error title=Volume not handed over::/data is owned by uid $owner"; status=1; }
          [ "$user" = 10001 ] || { echo "::error title=Relay runs as uid $user::expected 10001"; status=1; }
          if [ "$status" -ne 0 ]; then docker logs relay-vol >&2; fi
          docker rm -f relay-vol >/dev/null
          exit "$status"

      # Pull requests, and manual runs on a branch with no tag to publish under,
      # build only.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && steps.meta.outputs.tags != ''
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (amd64 + arm64) and push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.meta.outputs.tags != '' }}
          build-args: HIVELANE_COMMIT=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
