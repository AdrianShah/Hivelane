name: Audit

# Known-vulnerability scan of every dependency manifest in the repo. Weekly,
# because advisories get published against code that has not changed, and on
# any pull request that touches a manifest, so a vulnerable version cannot be
# merged in. Dependabot (.github/dependabot.yml) proposes the upgrades; this is
# the gate. A finding fails the run in both cases: a red scheduled run on main
# is the signal, and nobody should have to remember to read a report.
on:
  schedule:
    # Mondays, off the hour: scheduled runs on the hour are the most delayed.
    - cron: "23 6 * * 1"
  pull_request:
    paths:
      - "pyproject.toml"
      - "server/requirements*.txt"
      - "scripts/audit_gate.py"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "editors/vscode/package.json"
      - "editors/vscode/package-lock.json"
      - "docs-site/package.json"
      - "docs-site/package-lock.json"
      - ".github/workflows/audit.yml"
  workflow_dispatch:

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Only actionable findings fail a run: a vulnerability with a fixed release to
# upgrade to. One with no fix yet is reported as a warning (and stays visible
# in the log and the job summary) instead of turning every run red until
# upstream ships. scripts/audit_gate.py applies that rule to pip-audit's JSON;
# the npm jobs apply it to `npm audit --json` (fixAvailable). A finding judged
# not to affect Hivelane can still be skipped with `--ignore-vuln <ID>` on the
# pip-audit step, next to a comment saying why and when to look again.
jobs:
  relay:
    name: pip-audit (relay requirements)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # The relay image's Python; resolution depends on the interpreter.
          python-version: "3.12"
      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit
      - name: Audit
        # The relay's pinned dependencies as the Docker image installs them
        # (requirements-image.txt adds redis to requirements.txt).
        run: |
          pip-audit --progress-spinner off --desc on -r server/requirements-image.txt -f json -o "$RUNNER_TEMP/audit.json" || true
          python scripts/audit_gate.py pip "$RUNNER_TEMP/audit.json"

  package:
    name: pip-audit (hivelane package)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit
      - name: Resolve the package with every extra
        # pyproject.toml's ranges resolved the way `pipx install hivelane` (with
        # any of its extras) would resolve them today, then pinned, so the
        # audit sees exact versions. The extras are read from pyproject.toml
        # so a new one is covered without editing this file.
        run: |
          extras=$(python -c "import tomllib; print(','.join(tomllib.load(open('pyproject.toml', 'rb'))['project'].get('optional-dependencies', {})))")
          python -m venv "$RUNNER_TEMP/hivelane-env"
          "$RUNNER_TEMP/hivelane-env/bin/pip" install --quiet ".[$extras]"
          "$RUNNER_TEMP/hivelane-env/bin/pip" freeze --exclude-editable \
            | grep -v '^hivelane' > "$RUNNER_TEMP/hivelane-requirements.txt"
          cat "$RUNNER_TEMP/hivelane-requirements.txt"
      - name: Audit
        run: |
          pip-audit --progress-spinner off --desc on --no-deps --disable-pip \
            -r "$RUNNER_TEMP/hivelane-requirements.txt" -f json -o "$RUNNER_TEMP/audit.json" || true
          python scripts/audit_gate.py pip "$RUNNER_TEMP/audit.json"

  npm:
    # npm audit reads package-lock.json, so nothing is installed or run.
    # packaging/npm is left out: the launcher has no dependencies, and so no
    # lockfile to audit.
    name: npm audit (${{ matrix.dir }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: frontend
            flags: ""
          # The extension ships only its runtime dependency (ws); vsce and its
          # secretlint -> globby -> braces chain run on the packager's machine
          # and carry an advisory with no fixed release yet.
          - dir: editors/vscode
            flags: "--omit=dev"
          - dir: docs-site
            flags: ""
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Audit
        # High and critical with a fix available fail; moderate and low, and
        # high ones nobody can fix yet, are printed but pass.
        env:
          FLAGS: ${{ matrix.flags }}
        run: |
          # shellcheck disable=SC2086 # FLAGS is a word list
          npm audit $FLAGS || true
          # shellcheck disable=SC2086
          npm audit --json $FLAGS > "$RUNNER_TEMP/npm-audit.json" || true
          python3 "$GITHUB_WORKSPACE/scripts/audit_gate.py" npm "$RUNNER_TEMP/npm-audit.json"
