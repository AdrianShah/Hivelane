name: CI

on:
  pull_request:
  # Called by deploy.yml, which is what runs these checks on main. Running here
  # on push too would put both workflows in one concurrency group, where they
  # cancel each other and main shows a cancelled run even though it passed.
  workflow_call:

# A newer push to the same ref supersedes the run in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  relay:
    # The daemon runs on every contributor's machine, so path keys, loopback
    # sockets and process shutdown have to hold on each OS — not just the
    # Linux box the relay is deployed to.
    name: relay + daemon (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One OS failing says nothing about the others; let them all report.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            server/requirements*.txt
            pyproject.toml
      - name: Install
        run: pip install -r server/requirements-dev.txt -e ".[dev]"
      - name: Test
        # testpaths include tests/e2e: a real relay and two daemons in-process,
        # covering the cross-cwd collision the smoke job checks via the CLI.
        run: pytest -q
        timeout-minutes: 10

  dashboard:
    name: dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  image:
    # The relay image is the escape hatch from any one host, so it has to keep
    # building and booting — not just exist in the tree.
    name: relay image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: docker build -t synergo-relay:ci .
      - name: Boot and check readiness
        run: |
          docker run -d --name relay -p 8000:8000 \
            -e SYNERGO_ENV=production \
            -e CORS_ORIGINS=https://example.test \
            synergo-relay:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/readyz >/dev/null 2>&1; then
              curl -fsS http://127.0.0.1:8000/readyz
              docker rm -f relay >/dev/null
              exit 0
            fi
            sleep 2
          done
          echo "relay did not become ready" >&2
          docker logs relay >&2
          docker rm -f relay >/dev/null
          exit 1

  smoke:
    # Guards the claim the product rests on: an agent is denied an edit to a file
    # a teammate just touched, across differing working directories. Unit tests on
    # the relay or the daemon alone have already missed a break in this path.
    name: cross-cwd collision
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            server/requirements*.txt
            pyproject.toml
      - name: Install
        run: pip install -r server/requirements.txt -e .
      - name: Smoke
        run: ./scripts/smoke.sh
        timeout-minutes: 3
