name: CI

# The merge gate. Two lanes, sized for a private repo on GitHub Pro (3,000
# Actions minutes a month; Windows minutes bill 2x, macOS 10x):
#
#   Fast lane, every pull request: lint (ruff, mypy, actionlint, shellcheck,
#   hadolint, protocol schema, sdist/wheel build), Python tests on Ubuntu 3.12
#   and 3.13 (3.13 with coverage) and Windows 3.13, dashboard, VS Code
#   extension, docs + Pages artifact, cross-cwd smoke. Jobs whose files did not
#   change finish in seconds without running anything.
#
#   Cross-platform lane: macOS 3.13 and Windows 3.12 on top of the fast lane.
#   Runs on push to main (when Python changed; set the repository variable
#   CI_MACOS_ON_PUSH=false to leave it to the nightly run), on v* tags, and
#   nightly, where it is skipped when main's HEAD already passed it.
#
# Estimated billed minutes (Linux jobs ~1-5 min each, rounded up per job):
#   PR push touching Python   ~35  (Linux ~21 + Windows 3.13 ~7 min x2)
#   PR push, docs/frontend    ~14  (no-op Python legs still bill ~1 min each)
#   push to main, Python      ~100 (fast lane + macOS ~6 min x10 + Windows 3.12 x2)
#   push to main, no Python   ~14
#   nightly                   0 when HEAD already passed, else as push to main
#   Monthly, e.g. 40 PR pushes + 15 merges: ~1,400 + ~1,500 = ~2,900. Most PR
#   pushes and merges are not all Python, so expect well under that; flip
#   CI_MACOS_ON_PUSH=false to cap macOS at one run a day (~60 min) instead.
#
# Gate merges on the job named "ci passed" (it fails if any job here failed or
# was cancelled). The per-job names below are stable too and can be required
# individually: lint, python (ubuntu, 3.12), python (ubuntu, 3.13),
# python (windows, 3.13), dashboard, extension, docs, smoke.

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  schedule:
    # Nightly, off the hour (scheduled runs on the hour are the most delayed).
    - cron: "17 3 * * *"
  workflow_dispatch:

# One group per workflow + event + ref, so this never cancels (or is cancelled
# by) deploy.yml, pages.yml or any other workflow. Only pull requests cancel:
# a newer push to the same PR supersedes the run in flight; main and tags
# always finish.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  FORCE_COLOR: "1"

jobs:
  changes:
    # Which parts changed, so unaffected jobs can skip their work, and which
    # Python legs to run. No third-party action: the file list comes from the
    # GitHub API with the run's own token.
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      python: ${{ steps.filter.outputs.python }}
      frontend: ${{ steps.filter.outputs.frontend }}
      extension: ${{ steps.filter.outputs.extension }}
      docs: ${{ steps.filter.outputs.docs }}
      skip: ${{ steps.filter.outputs.skip }}
      matrix: ${{ steps.filter.outputs.matrix }}
    steps:
      - name: Classify the changed files
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          MACOS_ON_PUSH: ${{ vars.CI_MACOS_ON_PUSH }}
        run: |
          set -euo pipefail
          all=false
          files=""
          case "$EVENT" in
            pull_request)
              files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename') ;;
            push)
              if [[ "$REF" == refs/heads/* && -n "$BEFORE" && "$BEFORE" != 0000000000000000000000000000000000000000 ]]; then
                files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$SHA" --jq '.files[].filename') || all=true
                # The compare API lists at most 300 files.
                if [ "$(printf '%s\n' "$files" | wc -l)" -ge 300 ]; then all=true; fi
              else
                all=true
              fi ;;
            *) all=true ;;
          esac
          printf '%s\n' "$files" > "$RUNNER_TEMP/changed.txt"
          echo "Changed files:"; cat "$RUNNER_TEMP/changed.txt"

          has() { [ "$all" = true ] || grep -Eq "$1" "$RUNNER_TEMP/changed.txt"; }
          ci='^\.github/workflows/ci\.yml$'
          python=false; frontend=false; extension=false; docs=false
          has "^(hivelane|server|tests|protocol|scripts)/|^pyproject\.toml$|$ci" && python=true
          has "^frontend/|$ci" && frontend=true
          has "^editors/vscode/|$ci" && extension=true
          has "^(docs|docs-site|frontend)/|^README\.md$|^editors/vscode/README\.md$|^deploy/.*README\.md$|^scripts/build_pages\.sh$|$ci" && docs=true

          # Python legs. The fast lane always; the cross-platform lane on tags,
          # manual runs, nightly, and pushes to main that touch Python.
          fast='{"os":"ubuntu-latest","name":"ubuntu","python":"3.12"},{"os":"ubuntu-latest","name":"ubuntu","python":"3.13","coverage":true},{"os":"windows-latest","name":"windows","python":"3.13"}'
          wide='{"os":"macos-latest","name":"macos","python":"3.13"},{"os":"windows-latest","name":"windows","python":"3.12"}'
          cross=false
          case "$EVENT" in
            workflow_dispatch|schedule) cross=true ;;
            push)
              if [[ "$REF" == refs/tags/* ]]; then cross=true
              elif [ "$python" = true ] && [ "${MACOS_ON_PUSH:-true}" != false ]; then cross=true
              fi ;;
          esac

          # Nightly: nothing to do if this exact commit already passed CI from
          # an earlier night or manual run, or from its push to main (unless
          # CI_MACOS_ON_PUSH=false left macOS out of that push run).
          skip=false
          if [ "$EVENT" = schedule ]; then
            if [ "${MACOS_ON_PUSH:-true}" = false ]; then
              events='["schedule","workflow_dispatch"]'
            else
              events='["schedule","workflow_dispatch","push"]'
            fi
            passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SHA&status=success&per_page=30" \
              --jq "[.workflow_runs[] | select(.event as \$e | $events | index(\$e))] | length")
            if [ "${passed:-0}" -gt 0 ]; then skip=true; fi
          fi

          if [ "$cross" = true ]; then matrix="[$fast,$wide]"; else matrix="[$fast]"; fi
          {
            echo "python=$python"
            echo "frontend=$frontend"
            echo "extension=$extension"
            echo "docs=$docs"
            echo "skip=$skip"
            echo "matrix={\"include\":$matrix}"
          } >> "$GITHUB_OUTPUT"
          echo "python=$python frontend=$frontend extension=$extension docs=$docs cross=$cross skip=$skip"

  lint:
    name: lint
    needs: changes
    if: needs.changes.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            server/requirements*.txt
            pyproject.toml
      - name: Install
        # The package and the relay's pins, so mypy sees real third-party types.
        run: pip install -r server/requirements-dev.txt -e ".[dev,e2e]" build twine
      - name: ruff check
        run: ruff check --output-format=github .
      - name: ruff format --check (informational)
        # TODO: the tree predates the formatter (~90 files would change). Land
        # one `ruff format .` PR, then drop continue-on-error.
        continue-on-error: true
        run: ruff format --check --diff . > "$RUNNER_TEMP/format.diff" || { echo "::warning title=ruff format::$(grep -c '^--- ' "$RUNNER_TEMP/format.diff") files are not ruff-formatted (informational)"; exit 1; }
      - name: mypy (informational)
        # TODO: ~30 errors in hivelane/ and server/ today (pyproject [tool.mypy]
        # is deliberately lenient). Fix them, then drop continue-on-error.
        continue-on-error: true
        run: mypy
      - name: Protocol schema is up to date
        run: python protocol/generate.py --check
      - name: Build sdist + wheel
        # The release builds the same way; a file missing from the sdist or
        # broken metadata fails here, not at tag time.
        run: |
          python -m build --outdir "$RUNNER_TEMP/dist"
          twine check --strict "$RUNNER_TEMP"/dist/*
      - name: actionlint
        # Its image bundles shellcheck, which also checks every run: block.
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
      - name: shellcheck
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.11.0 \
            scripts/*.sh deploy/docker-entrypoint.sh setup.sh
      - name: hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile

  python:
    # The daemon runs on every contributor's machine, so path keys, loopback
    # sockets and process shutdown have to hold on each OS, not just the Linux
    # box the relay is deployed to. Never skipped as a whole on a pull request
    # (a skipped matrix job reports under an unexpanded name and would leave a
    # required check pending); its steps are skipped instead.
    name: python (${{ matrix.name }}, ${{ matrix.python }})
    needs: changes
    if: needs.changes.outputs.skip != 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      # One OS failing says nothing about the others; let them all report.
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    env:
      RUN: ${{ needs.changes.outputs.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.RUN == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: env.RUN == 'true'
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            server/requirements*.txt
            pyproject.toml
      - name: Install
        if: env.RUN == 'true'
        # e2e: the cryptography the encrypted-room tests need, explicitly
        # rather than through google-genai's dependency tree.
        run: pip install -r server/requirements-dev.txt -e ".[dev,e2e]"
      - name: Test
        if: env.RUN == 'true' && !matrix.coverage
        # testpaths include tests/e2e: a real relay and two daemons in-process.
        # Serial on purpose: under pytest-xdist the timing-sensitive daemon
        # tests flake and free-port picks race (see pyproject / the report).
        run: pytest -q --timeout=120 --reruns 1
      - name: Test with coverage
        if: env.RUN == 'true' && matrix.coverage
        run: pytest -q --timeout=120 --reruns 1 --cov --cov-report=xml:coverage.xml --cov-report=term
      - name: Coverage summary
        if: env.RUN == 'true' && matrix.coverage && !cancelled()
        shell: bash
        run: |
          if [ -f .coverage ]; then
            {
              echo "## Coverage (hivelane + server, py${{ matrix.python }})"
              coverage report --format=markdown --skip-covered
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.RUN == 'true' && matrix.coverage && !cancelled()
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 14

  dashboard:
    name: dashboard
    needs: changes
    if: needs.changes.outputs.skip != 'true' && needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # The tests run TypeScript directly (node --test *.ts), which needs
          # Node's type stripping: 22.18+ or 23.6+.
          node-version: "22"
          # The newest 22.x, not the runner's cached one: tools (Astro) raise
          # their minimum patch release without notice.
          check-latest: true
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Type check
        run: npx tsc -b
      - name: Unit tests
        run: npm run test:unit
      - name: Crypto test vectors (shared with the Python daemon)
        run: npm run test:e2e-crypto
      - name: Build
        run: npx vite build

  extension:
    name: extension
    needs: changes
    if: needs.changes.outputs.skip != 'true' && needs.changes.outputs.extension == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          # The newest 22.x, not the runner's cached one: tools (Astro) raise
          # their minimum patch release without notice.
          check-latest: true
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm ci
      - name: Compile and test
        run: npm test
      - name: Package
        run: npx vsce package --out hivelane.vsix
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vscode-extension
          path: editors/vscode/hivelane.vsix
          if-no-files-found: error
          retention-days: 14

  docs:
    # The docs site and the whole GitHub Pages artifact, exactly as pages.yml
    # deploys it from main: dashboard under /Hivelane/, docs under
    # /Hivelane/docs/, 404.html for deep links. This is the pull-request preview
    # check for Pages (pages.yml itself only runs on main, where it deploys).
    name: docs
    needs: changes
    if: needs.changes.outputs.skip != 'true' && needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Astro needs Node 22.12+.
          node-version: "22"
          # The newest 22.x, not the runner's cached one: tools (Astro) raise
          # their minimum patch release without notice.
          check-latest: true
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            docs-site/package-lock.json
      - name: Install
        run: |
          npm ci --prefix frontend
          npm ci --prefix docs-site
      - name: Build the Pages site
        run: bash scripts/build_pages.sh _site
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pages-preview
          path: _site
          retention-days: 3

  smoke:
    # Guards the claim the product rests on: an agent is denied an edit to a file
    # a teammate just touched, across differing working directories. Unit tests on
    # the relay or the daemon alone have already missed a break in this path.
    name: smoke
    needs: changes
    if: needs.changes.outputs.skip != 'true' && needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            server/requirements*.txt
            pyproject.toml
      - name: Install
        run: pip install -r server/requirements.txt -e .
      - name: Cross-cwd collision
        run: ./scripts/smoke.sh
        timeout-minutes: 3
      - name: Decision benchmark (informational)
        # Precision/recall of the edit-decision engine on the labelled sessions
        # in benchmarks/sessions. Reported, never gating.
        continue-on-error: true
        run: |
          {
            echo "## Decision benchmark"
            echo '```'
            python scripts/benchmark_decisions.py
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  ci-ok:
    # The one check to require in branch protection: green when every job
    # above passed or was skipped as not affected.
    name: ci passed
    needs: [changes, lint, python, dashboard, extension, docs, smoke]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All jobs passed or were skipped
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -Eq '"(failure|cancelled)"'; then
            echo "::error title=CI failed::at least one job failed or was cancelled"
            exit 1
          fi
