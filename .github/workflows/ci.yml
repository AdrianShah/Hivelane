name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Called by deploy.yml so a deploy cannot run on unverified code.
  workflow_call:

# A newer push to the same ref supersedes the run in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  relay:
    name: relay + daemon
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            server/requirements*.txt
            pyproject.toml
      - name: Install
        run: pip install -r server/requirements-dev.txt -e ".[dev]"
      - name: Test
        run: pytest -q

  dashboard:
    name: dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  smoke:
    # Guards the claim the product rests on: an agent is denied an edit to a file
    # a teammate just touched, across differing working directories. Unit tests on
    # the relay or the daemon alone have already missed a break in this path.
    name: cross-cwd collision
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            server/requirements*.txt
            pyproject.toml
      - name: Install
        run: pip install -r server/requirements.txt -e .
      - name: Smoke
        run: ./scripts/smoke.sh
        timeout-minutes: 3
