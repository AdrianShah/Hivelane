# Fly.io config for the Synergo relay. One-time setup is in README.md here.
#
# Deploy from the REPO ROOT, so the build context contains server/ and
# frontend/ (the image serves the dashboard too):
#
#   fly deploy --config deploy/fly/fly.toml
#
# Non-secret settings live in [env] below. CORS_ORIGINS — the dashboard
# origin(s) allowed to call the relay — is set with `fly secrets set`, so a new
# dashboard domain needs no commit. The relay refuses to boot in production
# without it, so a forgotten secret fails the deploy instead of serving open.

# Fly app names are global: change this to the name you created.
app = "synergo-relay"
primary_region = "iad"

# Regions. This runs ONE machine in primary_region, which needs nothing else.
#
# More machines (more regions, or more capacity) need Redis, because each relay
# process holds its rooms in memory:
#
#   fly redis create                      # Upstash Redis; note the URL it prints
#   fly secrets set --stage SYNERGO_REDIS_URL=redis://...  --config deploy/fly/fly.toml
#   fly volumes create synergo_data --region fra --size 1 --yes --config deploy/fly/fly.toml
#   fly scale count 2 --region iad,fra --config deploy/fly/fly.toml
#
# With SYNERGO_REDIS_URL set, room codes live in Redis (valid on every
# machine), and each room is leased to the machine its first member reached.
# Fly routes every client to its nearest machine; when that is not the room's
# owner, the relay answers the WebSocket upgrade with `fly-replay:
# instance=<owner>` and Fly's proxy replays the connection there, so a team
# always shares one machine. Each machine still needs its own volume (the
# [[mounts]] below), now only for its local copy of the room codes.
# Details: docs/self-hosting.md#scaling-out.

[build]
  # Relative to this file. The build context is the directory you deploy from.
  dockerfile = "../../Dockerfile"

[env]
  SYNERGO_ENV = "production"
  # On the volume mounted below, so room codes survive deploys and restarts.
  SYNERGO_STATE_PATH = "/data/rooms.sqlite3"
  # Client IPs for rate limits: on Fly (FLY_APP_NAME is set) the relay reads
  # Fly-Client-IP, which Fly's edge overwrites on every request; this is the
  # fallback for anything without it. See docs/security.md.
  TRUST_PROXY_HEADER = "true"
  # Set with `fly secrets set`, never here:
  #   CORS_ORIGINS=https://your-app.fly.dev   (required; the bundled dashboard
  #                                            is same-origin, but production
  #                                            needs at least one origin)
  #   GEMINI_API_KEY=...                      (optional AI captions)
  #   SYNERGO_REDIS_URL=redis://...           (only for more than one machine)

[[mounts]]
  source = "synergo_data"
  destination = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 8000
  force_https = true
  # Never stop for idleness: a stopped relay drops every daemon's WebSocket,
  # and pre-edit checks fail open (no coordination) until they reconnect.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  # Every daemon and dashboard tab holds one WebSocket open for hours. Fly's
  # default limits (25 connections) would cap a machine at a couple of teams.
  [http_service.concurrency]
    type = "connections"
    soft_limit = 800
    hard_limit = 1000

  # Liveness: the process is up and serving.
  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/health"

  # Readiness: configuration loaded (env, CORS, protocol versions).
  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/readyz"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
