# Render Blueprint for the Hivelane relay. Setup steps: README.md here.
#
# When creating the Blueprint in the Render dashboard, set the Blueprint Path
# to deploy/render/render.yaml (Render looks for render.yaml at the root).
services:
  - type: web
    name: hivelane-relay
    runtime: docker
    # Paths are relative to the repo root.
    dockerfilePath: ./Dockerfile
    dockerContext: .
    branch: main
    region: oregon
    # Smallest paid plan. Free instances cannot attach a disk and sleep when
    # idle, which drops every daemon's WebSocket.
    plan: 0.5c-512mb
    healthCheckPath: /readyz
    # Render deploys each commit on main once its GitHub checks (CI) pass.
    # To drive deploys from .github/workflows/deploy.yml instead, set this to
    # "off" and copy the Deploy Hook URL into the RELAY_DEPLOY_HOOK_URL secret.
    autoDeployTrigger: checksPass
    # Room codes live here so they survive deploys. A service with a disk
    # cannot scale past one instance, which is also what the relay needs today:
    # rooms are held in the process's memory.
    disk:
      name: hivelane-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: HIVELANE_ENV
        value: production
      - key: HIVELANE_STATE_PATH
        value: /data/hivelane.db
      # Render's proxy terminates TLS; without this every user shares one
      # rate-limit bucket. See the client-IP caveat in docs/self-hosting.md.
      - key: TRUST_PROXY_HEADER
        value: "true"
      # Exact origin(s) of dashboards hosted elsewhere, comma-separated. The
      # bundled dashboard (served at /) is same-origin and needs no entry; this
      # is the GitHub Pages dashboard (add https://hivelane.dev once that
      # domain is live).
      - key: CORS_ORIGINS
        value: https://adrianshah.github.io
      # Public-relay limits from docs/performance.md (one process handles about
      # 180-200 busy members; a room stays fast up to about 25).
      - key: HIVELANE_MAX_MEMBERS
        value: "25"
      - key: HIVELANE_MAX_ROOMS
        value: "500"
      # Optional AI captions and conflict summaries.
      - key: GEMINI_API_KEY
        sync: false
