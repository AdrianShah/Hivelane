# Self-hosted relay and dashboard: the relay image (which serves the dashboard
# at https://RELAY_DOMAIN/) behind Caddy, which obtains and renews a TLS
# certificate for RELAY_DOMAIN automatically. Full guide:
# docs/self-hosting.md. From this directory:
#
#   cp .env.example .env      # set RELAY_DOMAIN and CORS_ORIGINS
#   docker compose up -d --build
#
# Optional Redis: set COMPOSE_PROFILES=redis and
# SYNERGO_REDIS_URL=redis://redis:6379/0 in .env (see .env.example for what it
# changes and when it is worth it).
name: synergo

services:
  relay:
    build:
      # The repo root, so the image is the same one CI builds and boots.
      context: ../..
      dockerfile: Dockerfile
    image: synergo-relay:local
    restart: unless-stopped
    environment:
      SYNERGO_ENV: ${SYNERGO_ENV:-production}
      CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS to your dashboard origin(s) in .env}
      SYNERGO_STATE_PATH: /data/synergo.db
      # The dashboard, built into the image, at https://RELAY_DOMAIN/. It talks
      # to the relay on its own origin, so it needs no CORS entry. Set
      # SYNERGO_STATIC_DIR= (empty) in .env to serve the API only.
      SYNERGO_STATIC_DIR: ${SYNERGO_STATIC_DIR-/app/static}
      # Safe here: Caddy discards any X-Forwarded-For a client sends and sets
      # the real address, so the relay sees each user's own IP.
      TRUST_PROXY_HEADER: "true"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Empty keeps room codes and rate limits in this container; see the
      # redis profile below.
      SYNERGO_REDIS_URL: ${SYNERGO_REDIS_URL:-}
      # With Redis for rate limits only, keep room codes on the volume:
      # SYNERGO_ROOM_STORE=local in .env.
      SYNERGO_ROOM_STORE: ${SYNERGO_ROOM_STORE:-}
    volumes:
      # Room codes: without this every restart invalidates every room.
      - relay-data:/data
    # Not published: only Caddy talks to the relay.
    expose:
      - "8000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      relay:
        # The image's HEALTHCHECK polls /health.
        condition: service_healthy
    ports:
      - "80:80"     # ACME HTTP challenge, then redirects to HTTPS
      - "443:443"
      - "443:443/udp"
    environment:
      RELAY_DOMAIN: ${RELAY_DOMAIN:?set RELAY_DOMAIN to the relay's public hostname in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and ACME account: keep them, or every restart re-issues
      # and you hit the CA's rate limits.
      - caddy-data:/data
      - caddy-config:/config

  redis:
    image: redis:8-alpine
    profiles: ["redis"]
    restart: unless-stopped
    # Holds room codes (unless SYNERGO_ROOM_STORE=local) as well as
    # short-lived rate-limit counters, so it persists to its volume.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  relay-data:
  redis-data:
  caddy-data:
  caddy-config:
