<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-labelledby="t d">
  <title id="t">Hivelane architecture</title>
  <desc id="d">On each laptop the coding agent's hook asks the local daemon before an edit. The daemon sends edit_check to the relay, which answers allow, warn or block and streams a live feed over WebSocket to the dashboard.</desc>
  <!-- Same layout as the landing page diagram (frontend/src/site/ArchitectureDiagram.tsx).
       Self-contained dark card so it reads the same on GitHub and both docs themes. -->
  <defs>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <marker id="ah-b" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#3b95ff"/>
    </marker>
    <marker id="ah-g" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#30d158"/>
    </marker>
    <style>
      .box { fill: #1c1c1f; stroke: #333338; }
      .label { font: 600 11px ui-monospace, 'Geist Mono', Menlo, monospace; letter-spacing: 1.2px; fill: #8e8e93; }
      .chip { fill: #2a2a2e; }
      .chip-t { font: 13px -apple-system, 'Segoe UI', Inter, sans-serif; fill: #c7c7cc; }
      .strong { fill: rgba(59,149,255,0.18); }
      .strong-t { font: 600 13px -apple-system, 'Segoe UI', Inter, sans-serif; fill: #6cb0ff; }
      .arrow { font: 12px sans-serif; fill: #6e6e73; }
      .tag { font: 12px ui-monospace, 'Geist Mono', Menlo, monospace; }
      .h { font: 600 18px -apple-system, 'Segoe UI', Inter, sans-serif; fill: #f5f5f7; }
      .li { font: 13px -apple-system, 'Segoe UI', Inter, sans-serif; fill: #a1a1a6; }
    </style>
  </defs>

  <rect width="960" height="360" rx="20" fill="#121214"/>
  <rect width="960" height="360" rx="20" fill="url(#dots)"/>

  <!-- laptops -->
  <g>
    <rect class="box" x="32" y="60" width="300" height="104" rx="12"/>
    <text class="label" x="50" y="88">MAYA'S LAPTOP</text>
    <rect class="chip" x="50" y="108" width="96" height="30" rx="7"/><text class="chip-t" x="98" y="128" text-anchor="middle">Claude Code</text>
    <text class="arrow" x="156" y="128">→</text>
    <rect class="chip" x="172" y="108" width="52" height="30" rx="7"/><text class="chip-t" x="198" y="128" text-anchor="middle">hook</text>
    <text class="arrow" x="234" y="128">→</text>
    <rect class="strong" x="250" y="108" width="66" height="30" rx="7"/><text class="strong-t" x="283" y="128" text-anchor="middle">daemon</text>

    <rect class="box" x="32" y="196" width="300" height="104" rx="12"/>
    <text class="label" x="50" y="224">TOMÁS'S LAPTOP</text>
    <rect class="chip" x="50" y="244" width="70" height="30" rx="7"/><text class="chip-t" x="85" y="264" text-anchor="middle">Codex</text>
    <text class="arrow" x="130" y="264">→</text>
    <rect class="chip" x="146" y="244" width="52" height="30" rx="7"/><text class="chip-t" x="172" y="264" text-anchor="middle">hook</text>
    <text class="arrow" x="208" y="264">→</text>
    <rect class="strong" x="224" y="244" width="66" height="30" rx="7"/><text class="strong-t" x="257" y="264" text-anchor="middle">daemon</text>
  </g>

  <!-- laptops ⇄ relay -->
  <path d="M332 112 C 356 112, 352 170, 372 170" fill="none" stroke="#3a3a40" stroke-width="2"/>
  <path d="M332 248 C 356 248, 352 192, 372 192" fill="none" stroke="#3a3a40" stroke-width="2"/>
  <line x1="372" y1="170" x2="508" y2="170" stroke="#3b95ff" stroke-width="2" marker-end="url(#ah-b)"/>
  <line x1="508" y1="192" x2="372" y2="192" stroke="#30d158" stroke-width="2" marker-end="url(#ah-g)"/>
  <text class="tag" x="440" y="158" text-anchor="middle" fill="#3b95ff">edit_check</text>
  <text class="tag" x="440" y="214" text-anchor="middle" fill="#30d158">allow · warn · block</text>

  <!-- relay -->
  <rect x="514" y="104" width="190" height="152" rx="12" fill="#1c1c1f" stroke="#3b95ff" stroke-opacity="0.55"/>
  <rect x="510" y="100" width="198" height="160" rx="15" fill="none" stroke="#3b95ff" stroke-opacity="0.12" stroke-width="4"/>
  <text class="label" x="532" y="132">RELAY</text>
  <text class="h" x="532" y="158">Room</text>
  <text class="li" x="532" y="188"><tspan fill="#3b95ff">·</tspan> who is editing what</text>
  <text class="li" x="532" y="210"><tspan fill="#3b95ff">·</tspan> overlap check</text>
  <text class="li" x="532" y="232"><tspan fill="#3b95ff">·</tspan> optional e2e</text>

  <!-- relay → dashboard -->
  <line x1="704" y1="180" x2="772" y2="180" stroke="#3b95ff" stroke-width="2" marker-end="url(#ah-b)"/>
  <text class="tag" x="738" y="166" text-anchor="middle" fill="#3b95ff">live feed</text>
  <text class="tag" x="738" y="202" text-anchor="middle" fill="#8e8e93">WebSocket</text>

  <!-- dashboard -->
  <rect class="box" x="778" y="112" width="152" height="136" rx="12"/>
  <text class="label" x="796" y="140">DASHBOARD</text>
  <rect x="796" y="154" width="36" height="52" rx="5" fill="#2a2a2e"/>
  <rect x="836" y="154" width="36" height="52" rx="5" fill="rgba(255,55,120,0.12)" stroke="rgba(255,55,120,0.5)"/>
  <rect x="876" y="154" width="36" height="52" rx="5" fill="#2a2a2e"/>
  <text class="li" x="796" y="230">one lane per agent</text>
</svg>
