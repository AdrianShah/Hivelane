<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">File watcher versus pre-edit hook</title>
  <desc id="desc">Two sequence diagrams. Left: two agents both write greet() to the working tree, and a file watcher reports the overlap only after both edits are on disk. Right: each agent's hook asks the relay before writing; the first is allowed, the second is blocked, so only one edit is written.</desc>
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
    <marker id="a-no" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <!-- Opaque background so the diagram reads the same on light and dark pages. -->
  <rect x="0" y="0" width="900" height="480" fill="#ffffff"/>

  <!-- Panel frames -->
  <rect x="15" y="15" width="425" height="420" rx="10" fill="#f9fafb" stroke="#d1d5db"/>
  <rect x="460" y="15" width="425" height="420" rx="10" fill="#f9fafb" stroke="#d1d5db"/>

  <text x="227" y="42" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">File watcher: reports after the write</text>
  <text x="672" y="42" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Pre-edit hook: asks before the write</text>

  <!-- ===== Left panel: file watcher ===== -->
  <g font-size="12" fill="#111827">
    <rect x="30" y="58" width="90" height="28" rx="5" fill="#ffffff" stroke="#6b7280"/>
    <text x="75" y="76" text-anchor="middle">Agent A</text>
    <rect x="130" y="58" width="90" height="28" rx="5" fill="#ffffff" stroke="#6b7280"/>
    <text x="175" y="76" text-anchor="middle">Agent B</text>
    <rect x="230" y="58" width="90" height="28" rx="5" fill="#ffffff" stroke="#6b7280"/>
    <text x="275" y="76" text-anchor="middle">Working tree</text>
    <rect x="330" y="58" width="90" height="28" rx="5" fill="#ffffff" stroke="#6b7280"/>
    <text x="375" y="76" text-anchor="middle">Watcher</text>
  </g>
  <g stroke="#9ca3af" stroke-dasharray="4 4">
    <line x1="75" y1="86" x2="75" y2="350"/>
    <line x1="175" y1="86" x2="175" y2="350"/>
    <line x1="275" y1="86" x2="275" y2="350"/>
    <line x1="375" y1="86" x2="375" y2="350"/>
  </g>

  <g font-size="12" fill="#111827" stroke="#f9fafb" stroke-width="4" paint-order="stroke" stroke-linejoin="round">
    <text x="175" y="124" text-anchor="middle">1  writes greet()</text>
    <line x1="75" y1="132" x2="271" y2="132" stroke="#374151" stroke-width="1.5" marker-end="url(#a-ink)"/>

    <text x="225" y="164" text-anchor="middle">2  writes greet()</text>
    <line x1="175" y1="172" x2="271" y2="172" stroke="#374151" stroke-width="1.5" marker-end="url(#a-ink)"/>

    <rect x="233" y="190" width="84" height="34" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
    <text x="275" y="204" text-anchor="middle" font-size="11" stroke="none">both edits</text>
    <text x="275" y="218" text-anchor="middle" font-size="11" stroke="none">are on disk</text>

    <text x="325" y="246" text-anchor="middle">3  sees two edits</text>
    <line x1="275" y1="254" x2="371" y2="254" stroke="#374151" stroke-width="1.5" marker-end="url(#a-ink)"/>

    <text x="225" y="284" text-anchor="middle">4  alert: same file</text>
    <line x1="375" y1="292" x2="79" y2="292" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="6 3" marker-end="url(#a-no)"/>
    <line x1="375" y1="300" x2="179" y2="300" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="6 3" marker-end="url(#a-no)"/>
  </g>

  <rect x="30" y="365" width="395" height="54" rx="6" fill="#fee2e2" stroke="#b91c1c"/>
  <text x="227" y="387" text-anchor="middle" font-size="13" font-weight="700" fill="#7f1d1d">Reported, not prevented</text>
  <text x="227" y="406" text-anchor="middle" font-size="12" fill="#7f1d1d">Two versions of greet() exist; a person merges them.</text>

  <!-- ===== Right panel: pre-edit hook ===== -->
  <g font-size="12" fill="#111827">
    <rect x="475" y="58" width="90" height="28" rx="5" fill="#ffffff" stroke="#6b7280"/>
    <text x="520" y="76" text-anchor="middle">Agent A</text>
    <rect x="590" y="58" width="90" height="28" rx="5" fill="#ffffff" stroke="#6b7280"/>
    <text x="635" y="76" text-anchor="middle">Agent B</text>
    <rect x="750" y="58" width="120" height="28" rx="5" fill="#ffffff" stroke="#6b7280"/>
    <text x="810" y="76" text-anchor="middle">Hivelane relay</text>
  </g>
  <g stroke="#9ca3af" stroke-dasharray="4 4">
    <line x1="520" y1="86" x2="520" y2="350"/>
    <line x1="635" y1="86" x2="635" y2="350"/>
    <line x1="810" y1="86" x2="810" y2="350"/>
  </g>

  <g font-size="12" fill="#111827" stroke="#f9fafb" stroke-width="4" paint-order="stroke" stroke-linejoin="round">
    <text x="665" y="116" text-anchor="middle">1  pre-edit check: greet()</text>
    <line x1="520" y1="124" x2="806" y2="124" stroke="#374151" stroke-width="1.5" marker-end="url(#a-ink)"/>

    <text x="665" y="146" text-anchor="middle" fill="#047857">allow</text>
    <line x1="810" y1="154" x2="524" y2="154" stroke="#047857" stroke-width="1.5" stroke-dasharray="6 3" marker-end="url(#a-ok)"/>

    <rect x="482" y="168" width="76" height="34" rx="4" fill="#d1fae5" stroke="#047857" stroke-width="1"/>
    <text x="520" y="182" text-anchor="middle" font-size="11" stroke="none">edit is</text>
    <text x="520" y="196" text-anchor="middle" font-size="11" stroke="none">written</text>

    <text x="722" y="230" text-anchor="middle">2  pre-edit check: greet()</text>
    <line x1="635" y1="238" x2="806" y2="238" stroke="#374151" stroke-width="1.5" marker-end="url(#a-ink)"/>

    <text x="722" y="262" text-anchor="middle" fill="#b91c1c">block: A is editing greet()</text>
    <line x1="810" y1="270" x2="639" y2="270" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="6 3" marker-end="url(#a-no)"/>

    <rect x="590" y="286" width="90" height="48" rx="4" fill="#ffffff" stroke="#6b7280" stroke-width="1"/>
    <text x="635" y="302" text-anchor="middle" font-size="11" stroke="none">nothing written;</text>
    <text x="635" y="315" text-anchor="middle" font-size="11" stroke="none">agent waits or</text>
    <text x="635" y="328" text-anchor="middle" font-size="11" stroke="none">picks other work</text>
  </g>

  <rect x="475" y="365" width="395" height="54" rx="6" fill="#d1fae5" stroke="#047857"/>
  <text x="672" y="387" text-anchor="middle" font-size="13" font-weight="700" fill="#064e3b">Prevented</text>
  <text x="672" y="406" text-anchor="middle" font-size="12" fill="#064e3b">One version of greet(); nothing to merge.</text>

  <text x="450" y="462" text-anchor="middle" font-size="11" fill="#4b5563">Simplified: in Hivelane the agent's hook asks a local daemon, which asks the relay. Decisions are per function and line range.</text>
</svg>
