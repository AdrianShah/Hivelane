[build-system]
# >=1.27 for PEP 639: `license` as an SPDX expression (core metadata 2.4).
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "synergo"
# Single-sourced from synergo/__init__.py (see [tool.hatch.version]), so the
# release workflow's tag check and `synergo --version` can never disagree.
dynamic = ["version"]
description = "Live coordination for parallel AI coding agents: warns or blocks an edit when a teammate's agent is already in that file."
readme = "README.md"
requires-python = ">=3.12"
# Intended license. The LICENSE file itself lands separately; until it does,
# hatchling's default license-files globs simply match nothing.
license = "Apache-2.0"
authors = [{ name = "Synergo contributors" }]
keywords = [
    "ai-agents",
    "claude-code",
    "coding-agents",
    "collaboration",
    "conflict-detection",
    "developer-tools",
    "hooks",
    "multiplayer",
    "pair-programming",
    "websocket",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Software Development :: Version Control",
]
dependencies = [
    "websockets>=13,<16",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "pydantic>=2.12.5,<3",
    "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = ["pytest"]
# `synergo relay`: run the relay (server/, shipped in the wheel) on your own
# machine. fastapi, uvicorn, websockets and pydantic are already core
# dependencies; this adds what server/requirements.txt has on top, minus the
# heavy Gemini SDK (see `gemini`).
relay = ["python-dotenv>=1.0.1,<2", "uvicorn[standard]>=0.34,<1"]
# AI captions and conflict summaries on a relay you run, with GEMINI_API_KEY:
# synergo[relay,gemini]. Without it the relay uses deterministic placeholders.
gemini = ["google-genai>=2.14,<3"]
# Several relay instances sharing room codes, room leases and rate limits
# through SYNERGO_REDIS_URL (docs/self-hosting.md#scaling-out).
redis = ["redis>=5,<9"]
# Exact symbol extraction for JS/TS/Go/Rust/Java/C#/Ruby (Python always uses
# the stdlib ast); without it the daemon falls back to regex heuristics.
symbols = ["tree-sitter>=0.25", "tree-sitter-language-pack>=1.0"]
# End-to-end encrypted rooms (`e2e = true` in .synergo.toml): AES-256-GCM for
# the daemon's message blobs (docs/security.md#end-to-end-encryption).
e2e = ["cryptography>=42"]

[project.urls]
Homepage = "https://github.com/AdrianShah/Synergo"
Documentation = "https://github.com/AdrianShah/Synergo/tree/main/docs"
Repository = "https://github.com/AdrianShah/Synergo"
Issues = "https://github.com/AdrianShah/Synergo/issues"
Changelog = "https://github.com/AdrianShah/Synergo/releases"

[project.scripts]
synergo = "synergo.cli:main"

[tool.hatch.version]
path = "synergo/__init__.py"

[tool.hatch.build.targets.wheel]
# server/ is the relay, for `synergo relay` (deps: the `relay` extra). Its
# modules import each other relatively, so it works as an installed package;
# the flat-module fallback they carry is for Render's rootDir=server only and
# re-raises when imported as `server.*`.
packages = ["synergo", "server"]
# Tests run from the source tree; an installed CLI has no use for them, nor
# for the relay's deploy-only pins.
exclude = [
    "synergo/tests",
    "server/tests",
    "server/requirements*.txt",
    "server/runtime.txt",
]

[tool.hatch.build.targets.sdist]
# Anchored with a leading slash: these are gitignore-style patterns, and a bare
# "README.md" would sweep in every nested README in the repo.
include = ["/synergo", "/server", "/pyproject.toml", "/README.md"]

[tool.pytest.ini_options]
testpaths = ["synergo/tests", "server/tests", "tests/e2e"]
