[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "synergo"
version = "0.1.0"
description = "Local daemon, CLI and agent hook adapters for the Synergo relay."
requires-python = ">=3.12"
dependencies = [
    "websockets>=13,<16",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "pydantic>=2.12.5,<3",
    "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
synergo = "synergo.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["synergo"]

[tool.hatch.build.targets.sdist]
include = ["synergo", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["synergo/tests", "server/tests", "tests/e2e"]
