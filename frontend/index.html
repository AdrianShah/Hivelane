<!doctype html>
<html class="dark" data-theme="dark" lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <title>Synergo — Multiplayer AI Agent Viewer</title>
    <script>
      // Theme before first paint (no flash). Same logic as src/dashboard/theme.ts;
      // the key is THEME_STORAGE_KEY there. Storage may be blocked: then "system".
      (function () {
        var pref = 'system';
        try {
          var stored = window.localStorage.getItem('synergo:theme');
          if (stored === 'light' || stored === 'dark' || stored === 'system') pref = stored;
        } catch (e) {}
        var dark = true;
        if (pref === 'light') dark = false;
        else if (pref === 'system' && window.matchMedia) {
          dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        }
        var root = document.documentElement;
        root.setAttribute('data-theme', dark ? 'dark' : 'light');
        root.setAttribute('data-theme-pref', pref);
        root.classList.toggle('dark', dark);
        root.style.colorScheme = dark ? 'dark' : 'light';
      })();
    </script>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
    <script>
      // Colours are theme tokens (src/index.css): rgb(var(--c-*) / alpha) keeps
      // Tailwind's opacity modifiers (bg-primary/10) working in both themes.
      var token = function (name) {
        return 'rgb(var(--c-' + name + ') / <alpha-value>)';
      };
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              background: token('background'),
              surface: token('surface'),
              'surface-card': token('surface-card'),
              'surface-raised': token('surface-raised'),
              'surface-deep': token('surface-deep'),
              primary: token('primary'),
              lavender: token('lavender'),
              'lavender-bright': token('lavender-bright'),
              indigo: token('indigo'),
              emerald: token('emerald'),
              amber: token('amber'),
              error: token('error'),
              'error-deep': token('error-deep'),
              'on-surface': token('on-surface'),
              'on-muted': token('on-muted'),
              'on-dim': token('on-dim'),
              'on-accent': token('on-accent'),
              outline: token('outline'),
              'outline-soft': token('outline-soft'),
              ink: token('ink'),
              shade: token('shade'),
              scrim: token('scrim'),
            },
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace'],
            },
            boxShadow: {
              live: 'var(--shadow-live)',
              card: 'var(--shadow-card)',
              'card-hover': 'var(--shadow-card-hover)',
              conflict: 'var(--shadow-conflict)',
              fab: 'var(--fab-shadow)',
            },
            keyframes: {
              'fade-up': {
                '0%': { opacity: '0', transform: 'translateY(6px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              'pulse-dot': {
                '0%, 100%': { opacity: '1' },
                '50%': { opacity: '0.45' },
              },
            },
            animation: {
              'fade-up': 'fade-up 0.45s ease-out both',
              'pulse-dot': 'pulse-dot 2s ease-in-out infinite',
            },
          },
        },
      };
    </script>
  </head>
  <body class="h-screen overflow-hidden bg-background text-on-surface font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
