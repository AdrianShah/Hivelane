<!doctype html>
<html class="dark" lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Synergo — Multiplayer AI Agent Viewer</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              background: '#090E18',
              surface: '#0E1522',
              'surface-card': '#121A28',
              'surface-raised': '#172032',
              'surface-deep': '#080C14',
              primary: '#5EEAD4',
              lavender: '#A5B4FC',
              'lavender-bright': '#C7D2FE',
              indigo: '#818CF8',
              emerald: '#34D399',
              amber: '#FBBF24',
              error: '#FB7185',
              'error-deep': '#881337',
              'on-surface': '#F8FAFC',
              'on-muted': '#94A3B8',
              'on-dim': '#64748B',
              outline: '#1C2536',
              'outline-soft': '#243044',
            },
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace'],
            },
            boxShadow: {
              live: '0 0 0 3px rgba(52, 211, 153, 0.18)',
              card: '0 1px 0 rgba(255,255,255,0.03) inset, 0 12px 40px rgba(0,0,0,0.28)',
              'card-hover':
                '0 1px 0 rgba(255,255,255,0.05) inset, 0 16px 48px rgba(0,0,0,0.35)',
              conflict: '0 0 0 1px rgba(251, 113, 133, 0.35), 0 12px 40px rgba(136, 19, 55, 0.25)',
              fab: '0 10px 30px rgba(129, 140, 248, 0.35)',
            },
            keyframes: {
              'fade-up': {
                '0%': { opacity: '0', transform: 'translateY(6px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              'pulse-dot': {
                '0%, 100%': { opacity: '1' },
                '50%': { opacity: '0.45' },
              },
            },
            animation: {
              'fade-up': 'fade-up 0.45s ease-out both',
              'pulse-dot': 'pulse-dot 2s ease-in-out infinite',
            },
          },
        },
      };
    </script>
  </head>
  <body class="h-screen overflow-hidden bg-background text-on-surface font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
