<!doctype html>
<html data-theme="light" lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Hivelane</title>
    <script>
      // Theme before first paint (no flash). Same logic as src/dashboard/theme.ts;
      // the key is THEME_STORAGE_KEY there. A stored choice wins; otherwise the
      // system setting; with neither (or blocked storage), light.
      (function () {
        var pref = 'system';
        try {
          var stored = window.localStorage.getItem('hivelane:theme');
          if (stored === 'light' || stored === 'dark' || stored === 'system') pref = stored;
        } catch (e) {}
        var dark = false;
        if (pref === 'dark') dark = true;
        else if (pref === 'system' && window.matchMedia) {
          try {
            dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          } catch (e) {}
        }
        var root = document.documentElement;
        root.setAttribute('data-theme', dark ? 'dark' : 'light');
        root.setAttribute('data-theme-pref', pref);
        root.classList.toggle('dark', dark);
        root.style.colorScheme = dark ? 'dark' : 'light';
      })();
    </script>
    <!-- Tailwind is compiled into the Vite build (src/index.css), no CDN. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&family=Geist:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <!-- No overflow-hidden here: the Home page scrolls; .app-shell (the dashboard) is viewport-tall itself. -->
  <body class="bg-background text-on-surface font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
